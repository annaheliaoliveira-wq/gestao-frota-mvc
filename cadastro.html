<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro</title>
</head>

<body>

<h1>Cadastro de Usuário</h1>

<input
type="text"
id="nome"
placeholder="Nome">

<br><br>

<input
type="email"
id="email"
placeholder="Email">

<br><br>

<input
type="password"
id="senha"
placeholder="Senha">

<br><br>

<button onclick="cadastrar()">
Cadastrar
</button>

<script src="app/models/usuarioModel.js"></script>

<script>

function cadastrar(){

    const nome =
    document.getElementById(
    "nome").value;

    const email =
    document.getElementById(
    "email").value;

    const senha =
    document.getElementById(
    "senha").value;

    const usuarioModel =
    new UsuarioModel();

    usuarioModel.cadastrar(
        nome,
        email,
        senha
    );

    alert(
    "Usuário cadastrado com sucesso!"
    );

    window.location.href =
    "login.html";
}

</script>

</body>
</html>
