<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>
</head>

<body>

<h1>Login</h1>

<input
type="email"
id="email"
placeholder="Email">

<br><br>

<input
type="password"
id="senha"
placeholder="Senha">

<br><br>

<button onclick="entrar()">
Entrar
</button>

<script src="app/models/usuarioModel.js"></script>

<script>

function entrar(){

    const email =
    document.getElementById(
    "email").value;

    const senha =
    document.getElementById(
    "senha").value;

    const usuarioModel =
    new UsuarioModel();

    const usuario =
    usuarioModel.login(
        email,
        senha
    );

    if(usuario){

        localStorage.setItem(
            "usuarioLogado",
            email
        );

        alert(
        "Login realizado com sucesso!"
        );

        window.location.href =
        "index.html";

    }else{

        alert(
        "Email ou senha inválidos."
        );

    }
}

</script>

</body>
  </html>
